<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocab Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap');

  :root {
    --bg: #f5f2eb;
    --surface: #ffffff;
    --border: #d4cfc4;
    --text: #1a1a1a;
    --muted: #888;
    --accent: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --green-bg: #dcfce7;
    --red-bg: #fee2e2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .screen { display: none; width: 100%; max-width: 540px; }
  .screen.active { display: block; }

  /* ── HOME ── */
  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 36px;
  }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }

  .btn-level {
    padding: 10px 0;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
    color: var(--text);
  }

  .btn-level:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn-level.selected { border-color: var(--accent); background: var(--accent); color: #fff; }

  /* ── COUNT BUTTONS ── */
  .count-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }

  .btn-count {
    padding: 10px 0;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
    color: var(--text);
  }

  .btn-count:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn-count.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
  .btn-count:disabled { opacity: .32; cursor: not-allowed; background: var(--bg); }

  .mode-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 32px;
  }

  .btn-mode {
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    transition: all .15s;
    color: var(--text);
  }

  .btn-mode:hover { border-color: var(--accent); color: var(--accent); }
  .btn-mode.selected { border-color: var(--accent); background: var(--accent); color: #fff; }

  .btn-start {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }

  .btn-start:disabled { opacity: .35; cursor: not-allowed; }
  .btn-start:not(:disabled):hover { opacity: .85; }

  /* ── QUIZ ── */
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .btn-back {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }

  .btn-back:hover { color: var(--text); }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    margin-left: 20px;
  }

  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width .4s ease;
  }

  .progress-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .score-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    padding: 4px 10px;
    border-radius: 99px;
    color: var(--muted);
    margin-left: 12px;
    flex-shrink: 0;
  }

  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 36px 32px;
    text-align: center;
    margin-bottom: 20px;
  }

  .card-hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .card-word {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -1px;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 12px;
  }

  #answer-input {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color .15s, background .15s;
  }

  #answer-input:focus { border-color: var(--accent); }
  #answer-input.correct { border-color: var(--green); background: var(--green-bg); }
  #answer-input.wrong   { border-color: var(--red);   background: var(--red-bg);   }

  .feedback {
    min-height: 22px;
    font-size: 13px;
    text-align: center;
    margin-bottom: 12px;
    font-weight: 600;
    transition: opacity .2s;
  }

  .feedback.correct { color: var(--green); }
  .feedback.wrong   { color: var(--red); }

  .btn-submit {
    width: 100%;
    padding: 13px;
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }

  .btn-submit:hover { opacity: .75; }
  .btn-submit:disabled { opacity: .3; cursor: not-allowed; }

  /* ── FINISH ── */
  .finish-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 40px 32px;
    text-align: center;
  }

  .finish-icon { font-size: 48px; margin-bottom: 16px; }
  .finish-title { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
  .finish-score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    margin: 12px 0 4px;
  }
  .finish-pct { font-size: 14px; color: var(--muted); margin-bottom: 24px; }

  .finish-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
  }

  .btn-retry {
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-home {
    padding: 12px 24px;
    background: none;
    color: var(--muted);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }

  .btn-home:hover, .btn-retry:hover { opacity: .8; }

  /* ── WRONG LIST ── */
  .wrong-list-wrap {
    text-align: left;
    border-top: 1.5px solid var(--border);
    padding-top: 20px;
  }

  .wrong-list-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .wrong-item {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 5px;
    background: var(--red-bg);
    color: var(--red);
    margin-bottom: 6px;
    border: 1px solid #fca5a5;
  }

  .all-correct-msg {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--green);
    padding: 14px;
    background: var(--green-bg);
    border: 1px solid #86efac;
    border-radius: 6px;
    text-align: center;
    border-top: 1.5px solid var(--border);
    padding-top: 20px;
  }

  /* ── EMPTY NOTICE ── */
  .empty-notice {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     HOME SCREEN
══════════════════════════════════════════ -->
<div id="screen-home" class="screen active">
  <div class="logo">Vocab Quiz</div>
  <h1>Belajar Kosakata</h1>
  <p class="subtitle">Pilih level, jumlah soal, dan mode, lalu mulai latihan.</p>

  <div class="section-label">Pilih Level</div>
  <div class="level-grid" id="level-grid"></div>

  <div class="section-label">Pilih Jumlah Soal</div>
  <div class="count-grid" id="count-grid"></div>

  <div class="section-label">Pilih Mode</div>
  <div class="mode-list">
    <button class="btn-mode" data-mode="toId">🇮🇩 &nbsp;Translate ke Bahasa Indonesia</button>
    <button class="btn-mode" data-mode="toEn">🇬🇧 &nbsp;Translate ke Bahasa Inggris</button>
  </div>

  <button class="btn-start" id="btn-start" disabled>Mulai Quiz →</button>
</div>

<!-- ══════════════════════════════════════════
     QUIZ SCREEN
══════════════════════════════════════════ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <button class="btn-back" id="btn-back">← Kembali</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-text" id="progress-text">0/0</span>
    </div>
    <span class="score-badge" id="score-badge">✓ 0</span>
  </div>

  <div class="card" id="quiz-card">
    <div class="card-hint" id="card-hint"></div>
    <div class="card-word" id="card-word"></div>
  </div>

  <div class="input-wrap">
    <input type="text" id="answer-input" placeholder="Ketik jawabanmu…" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <div class="feedback" id="feedback"></div>
  <button class="btn-submit" id="btn-submit">Cek Jawaban</button>
</div>

<!-- ══════════════════════════════════════════
     FINISH SCREEN
══════════════════════════════════════════ -->
<div id="screen-finish" class="screen">
  <div class="finish-box">
    <div class="finish-icon" id="finish-icon">🎉</div>
    <div class="finish-title">Quiz Selesai!</div>
    <div class="finish-score" id="finish-score">0 / 0</div>
    <div class="finish-pct" id="finish-pct"></div>
    <div class="finish-actions">
      <button class="btn-retry" id="btn-retry">Ulangi</button>
      <button class="btn-home" id="btn-home">Halaman Utama</button>
    </div>
    <div id="finish-wrong-section"></div>
  </div>
</div>

/* ──────────────────────────────────────────
   STATE
────────────────────────────────────────── */
let selectedLevel  = null;
let selectedCount  = null;  // number or "full"
let selectedMode   = null;  // "toId" | "toEn"
let questions      = [];
let currentIdx     = 0;
let score          = 0;
let wrongAnswers   = [];
let answered       = false;

/* ──────────────────────────────────────────
   HELPERS
────────────────────────────────────────── */
const $    = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(str) {
  return str.trim().toLowerCase()
    .replace(/[.,!?;:'"]/g, '')
    .replace(/\s+/g, ' ');
}

function isCorrect(userAnswer, correctField) {
  const norm = normalize(userAnswer);
  const accepted = correctField.split('/').map(s => normalize(s));
  return accepted.includes(norm);
}

/* ──────────────────────────────────────────
   COUNT OPTIONS
────────────────────────────────────────── */
const COUNT_OPTIONS = [10, 20, 30, 40, 50, 'Full'];

/* ──────────────────────────────────────────
   BUILD HOME
────────────────────────────────────────── */

// Level buttons
const levelGrid = $('level-grid');
for (let i = 1; i <= 10; i++) {
  const btn = document.createElement('button');
  btn.className = 'btn-level';
  btn.textContent = `L${i}`;
  btn.dataset.level = i;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn-level').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedLevel = i;
    // reset count selection and update count buttons
    selectedCount = null;
    updateCountButtons();
    checkReady();
  });
  levelGrid.appendChild(btn);
}

// Count buttons
const countGrid = $('count-grid');
COUNT_OPTIONS.forEach(opt => {
  const btn = document.createElement('button');
  btn.className = 'btn-count';
  btn.textContent = opt === 'Full' ? 'Full' : opt;
  btn.dataset.count = opt;
  btn.disabled = true; // disabled until a level is selected
  btn.addEventListener('click', () => {
    if (btn.disabled) return;
    document.querySelectorAll('.btn-count').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedCount = opt;
    checkReady();
  });
  countGrid.appendChild(btn);
});

function updateCountButtons() {
  const levelWords = (VOCAB[selectedLevel] || []).length;
  document.querySelectorAll('.btn-count').forEach(btn => {
    const val = btn.dataset.count;
    btn.classList.remove('selected');
    if (val === 'Full') {
      // Full is always enabled if level has at least 1 word
      btn.disabled = levelWords === 0;
    } else {
      const n = parseInt(val, 10);
      btn.disabled = n > levelWords;
    }
  });
  selectedCount = null;
}

// Mode buttons
document.querySelectorAll('.btn-mode').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMode = btn.dataset.mode;
    checkReady();
  });
});

function checkReady() {
  $('btn-start').disabled = !(selectedLevel !== null && selectedCount !== null && selectedMode !== null);
}

$('btn-start').addEventListener('click', startQuiz);

/* ──────────────────────────────────────────
   START QUIZ
────────────────────────────────────────── */
function startQuiz() {
  const raw = VOCAB[selectedLevel] || [];

  // Reset input/submit visibility
  $('answer-input').style.display = '';
  $('btn-submit').style.display = '';

  if (!raw.length) {
    show('screen-quiz');
    $('quiz-card').innerHTML = `<div class="empty-notice">Level ${selectedLevel} belum ada soal.<br>Silakan isi data di bagian <code>VOCAB[${selectedLevel}]</code>.</div>`;
    $('answer-input').style.display = 'none';
    $('feedback').textContent = '';
    $('btn-submit').style.display = 'none';
    return;
  }

  const shuffled = shuffle(raw);
  if (selectedCount === 'Full') {
    questions = shuffled;
  } else {
    questions = shuffled.slice(0, parseInt(selectedCount, 10));
  }

  currentIdx   = 0;
  score        = 0;
  wrongAnswers = [];
  answered     = false;

  show('screen-quiz');
  renderQuestion();
}

/* ──────────────────────────────────────────
   RENDER QUESTION
────────────────────────────────────────── */
function renderQuestion() {
  const q = questions[currentIdx];
  answered = false;

  if (selectedMode === 'toId') {
    $('card-hint').textContent = 'Apa artinya dalam Bahasa Indonesia?';
    $('card-word').textContent = q.en;
  } else {
    $('card-hint').textContent = 'Apa terjemahan Bahasa Inggrisnya?';
    $('card-word').textContent = q.id;
  }

  // Reset card
  $('quiz-card').style.borderColor = '';

  const inp = $('answer-input');
  inp.value = '';
  inp.className = '';
  inp.disabled = false;
  inp.focus();

  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  $('btn-submit').disabled = false;
  $('btn-submit').textContent = 'Cek Jawaban';

  // Progress
  const total = questions.length;
  const done  = currentIdx;
  $('progress-fill').style.width = `${(done / total) * 100}%`;
  $('progress-text').textContent = `${done + 1}/${total}`;
  $('score-badge').textContent   = `✓ ${score}`;
}

/* ──────────────────────────────────────────
   SUBMIT ANSWER
────────────────────────────────────────── */
function submitAnswer() {
  if (answered) return;

  const inp    = $('answer-input');
  const rawVal = inp.value;
  if (!rawVal.trim()) return;

  answered = true;

  const q         = questions[currentIdx];
  const correct   = selectedMode === 'toId' ? q.id : q.en;
  const right     = isCorrect(rawVal, correct);
  const fb        = $('feedback');

  if (right) {
    score++;
    inp.classList.add('correct');
    fb.textContent = '✓ Benar!';
    fb.className   = 'feedback correct';
  } else {
    inp.classList.add('wrong');
    fb.textContent = `✗ Jawaban: ${correct}`;
    fb.className   = 'feedback wrong';
    wrongAnswers.push(q);
  }

  $('btn-submit').disabled = true;
  $('score-badge').textContent = `✓ ${score}`;

  setTimeout(nextQuestion, 1500);
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= questions.length) {
    showFinish();
  } else {
    renderQuestion();
  }
}

/* ──────────────────────────────────────────
   FINISH
────────────────────────────────────────── */
function showFinish() {
  const total = questions.length;
  const pct   = Math.round((score / total) * 100);

  $('finish-score').textContent = `${score} / ${total}`;
  $('finish-pct').textContent   = `${pct}% benar`;

  // Icon & title tweak
  $('finish-icon').textContent = pct === 100 ? '🏆' : pct >= 70 ? '🎉' : '📚';

  // Wrong answers section
  const section = $('finish-wrong-section');
  if (wrongAnswers.length === 0) {
    section.innerHTML = `<div class="all-correct-msg">Semua jawaban benar 🎉</div>`;
  } else {
    const items = wrongAnswers.map(q =>
      `<div class="wrong-item">${q.en} = ${q.id}</div>`
    ).join('');
    section.innerHTML = `
      <div class="wrong-list-wrap">
        <div class="wrong-list-title">Jawaban Salah (${wrongAnswers.length})</div>
        ${items}
      </div>`;
  }

  show('screen-finish');
}

/* ──────────────────────────────────────────
   EVENT LISTENERS
────────────────────────────────────────── */
$('btn-submit').addEventListener('click', submitAnswer);

$('answer-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAnswer();
});

$('btn-back').addEventListener('click', () => {
  show('screen-home');
});

$('btn-retry').addEventListener('click', startQuiz);

$('btn-home').addEventListener('click', () => {
  show('screen-home');
});
</script>
